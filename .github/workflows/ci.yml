name: ci

# Compile checks for every backend plus the CPU-oracle test suite. Hosted runners
# have no NVIDIA GPU (and macOS runners may have no Metal device), so the test
# that requires every compiled-in GPU backend to be present is excluded here;
# it runs on real hardware. Slow numerical verification is run explicitly.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GPU_PRESENCE_TEST: "compiled GPU backends*"

jobs:
  linux-cuda:
    runs-on: ubuntu-24.04
    container: nvidia/cuda:13.0.2-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: apt-get update -qq && apt-get install -y -qq cmake ninja-build python3 libhdf5-dev zlib1g-dev git
      - name: Portability lint
        run: python3 tools/lint_portability.py
      - name: Configure
        run: cmake -S . -B build -G Ninja -DKUTTA_ENABLE_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES="75-real;86-real;89-real;120"
      - name: Build
        run: cmake --build build
      - name: Test (CPU oracle)
        run: ./build/kutta-tests --test-suite-exclude=slow --test-case-exclude="$GPU_PRESENCE_TEST"

  windows-cuda:
    runs-on: windows-2022  # pinned: windows-latest maps to Visual Studio 2026
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "13.0.2"
          method: network
          sub-packages: '["nvcc", "cudart", "crt", "nvvm", "visual_studio_integration"]'
          use-github-cache: true
      # Pin both port recipes and dependency source hashes; no runner-global vcpkg.
      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 84bab45d415d22042bd0b9081aea57f362da3f35 # 2025.12.12
          path: .vcpkg
      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\.vcpkg\bootstrap-vcpkg.bat -disableMetrics
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DKUTTA_ENABLE_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES="75-real;86-real;89-real;120"
          -DKUTTA_REQUIRE_HDF5=ON
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/.vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_MANIFEST_DIR="${{ github.workspace }}/cmake/windows"
          -DVCPKG_TARGET_TRIPLET=x64-windows
      - name: Build
        run: cmake --build build
      - name: Test (CPU oracle)
        shell: bash
        run: ./build/kutta-tests.exe --test-suite-exclude=slow --test-case-exclude="$GPU_PRESENCE_TEST"

      - name: Package Windows CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = "build/kutta-windows-rtx"
          $deps = "build/vcpkg_installed/x64-windows"
          New-Item -ItemType Directory -Force "$package/licenses" | Out-Null
          Copy-Item build/kutta.exe $package
          # This manifest builds only HDF5+zlib. Copy release DLLs, including
          # transitive dependencies, without relying on the runner's PATH.
          Copy-Item "$deps/bin/*.dll" $package
          foreach ($port in @("hdf5", "zlib")) {
            Copy-Item "$deps/share/$port/copyright" "$package/licenses/LICENSE-$port.txt"
          }
          # The minimal CUDA installer may omit documentation. Bundle the
          # versioned NVIDIA notice, with a pinned content hash, for static cudart.
          $cudaLicense = "$package/licenses/LICENSE-CUDA-13.0.2.pdf"
          Invoke-WebRequest https://docs.nvidia.com/cuda/archive/13.0.2/pdf/EULA.pdf -OutFile $cudaLicense
          if ((Get-FileHash $cudaLicense -Algorithm SHA256).Hash -ne "c365e3bfe9ed70d7fb7dbacc4fdd4b4a15fb951be5440f0f6bd95e3c935e93ef") {
            throw "CUDA license content changed"
          }
          Copy-Item docs/README-windows.txt $package
          "Kutta source: ${{ github.sha }}" | Set-Content "$package/build-info.txt"
          # Every DLL kutta.exe imports must be bundled or ship with Windows.
          dumpbin /nologo /dependents "$package/kutta.exe"
          Get-ChildItem $package -Filter *.dll | ForEach-Object { $_.Name }
          # Load the packaged executable with dependency directories removed.
          # Capture streams and exit code directly: under "Stop", PowerShell can
          # turn a native program's stderr into a terminating error.
          $env:PATH = "$env:SystemRoot/system32;$env:SystemRoot"
          $out = "$env:RUNNER_TEMP/kutta-out.txt"; $err = "$env:RUNNER_TEMP/kutta-err.txt"
          $run = Start-Process -FilePath (Resolve-Path "$package/kutta.exe") -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput $out -RedirectStandardError $err
          $usage = (Get-Content $out -Raw) + (Get-Content $err -Raw)
          Write-Host ("kutta.exe exit code {0} (0x{0:X8}); output: {1}" -f $run.ExitCode, $usage)
          if ($run.ExitCode -ne 2 -or $usage -notmatch "Usage: kutta") {
            throw "Packaged CLI failed to load"
          }
          Compress-Archive -Path "$package/*" -DestinationPath build/kutta-windows-rtx.zip
      - uses: actions/upload-artifact@v4
        with:
          name: kutta-windows-rtx
          path: build/kutta-windows-rtx.zip
          if-no-files-found: error

  macos-metal:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: brew install ninja hdf5
      - name: Configure
        run: cmake -S . -B build -G Ninja
      - name: Build
        run: cmake --build build
      - name: Test
        run: ./build/kutta-tests --test-suite-exclude=slow --test-case-exclude="$GPU_PRESENCE_TEST"

  # Desktop app (app/) with Qt 6.12.0 pinned through aqtinstall 3.3.0: build,
  # unit tests, a screenshot smoke test through the platform GPU API, and the
  # package. Scenarios and tests use the fixture CLI (no case files in CI);
  # the packages bundle the real kutta CLI.
  app-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt
        run: |
          python -m pip install aqtinstall==3.3.0
          aqt install-qt mac desktop 6.12.0 clang_64 -m qtshadertools --outputdir "$RUNNER_TEMP/Qt"
      - name: Dependencies
        run: brew install ninja hdf5
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DKUTTA_BUILD_APP=ON -DKUTTA_BUILD_TESTS=OFF
          -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/Qt/6.12.0/macos"
      - name: Build
        run: cmake --build build
      - name: Unit tests
        run: ctest --test-dir build -L app -LE gui --output-on-failure
      - name: Screenshot smoke (Metal)
        run: ctest --test-dir build -R app-screenshot-smoke --output-on-failure
      - name: Package
        run: cmake --build build --target package-app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kutta-app-macos
          path: |
            build/app/package/Kutta-*-macos.zip
            build/app/smoke/*.png
          if-no-files-found: error

  app-windows:
    needs: windows-cuda  # bundles that job's packaged kutta.exe
    runs-on: windows-2022
    env:
      QSG_RHI_PREFER_SOFTWARE_RENDERER: "1"  # no GPU on hosted runners: D3D11 on WARP
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # Qt 6.12 splits the Windows repository per compiler, which aqtinstall
      # 3.3.0 cannot read (miurahr/aqtinstall#1048 is unmerged); naqt can.
      - name: Qt
        shell: pwsh
        run: |
          git clone -q https://github.com/jdpurcell/naqt "$env:RUNNER_TEMP/naqt"
          git -C "$env:RUNNER_TEMP/naqt" checkout -q 43da90f1464edd4cf39cb001a02022117070640f
          dotnet run -c Release --project "$env:RUNNER_TEMP/naqt" -- install-qt windows desktop 6.12.0 win64_msvc2022_64 --modules qtshadertools --outputdir "$env:RUNNER_TEMP/Qt"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "$env:RUNNER_TEMP/Qt/6.12.0/msvc2022_64/bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - uses: actions/download-artifact@v4
        with:
          name: kutta-windows-rtx
          path: ${{ runner.temp }}/solver-zip
      - name: Solver
        shell: pwsh
        run: Expand-Archive "$env:RUNNER_TEMP/solver-zip/kutta-windows-rtx.zip" -DestinationPath "$env:RUNNER_TEMP/solver"
      - name: Configure
        shell: pwsh
        run: >-
          cmake -S app -B build-app -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$env:RUNNER_TEMP/Qt/6.12.0/msvc2022_64"
          -DKUTTA_APP_SOLVER_DIR="$env:RUNNER_TEMP/solver"
      - name: Build
        run: cmake --build build-app
      - name: Unit tests
        run: ctest --test-dir build-app -L app -LE gui --output-on-failure
      - name: Screenshot smoke (D3D11 / WARP)
        run: ctest --test-dir build-app -R app-screenshot-smoke --output-on-failure
      - name: Package
        run: cmake --build build-app --target package-app
      # Run the unzipped package without Qt or the toolchain on PATH, so a DLL
      # windeployqt or the solver bundle missed fails here, not on a user's PC.
      - name: Packaged smoke (clean PATH)
        shell: pwsh
        run: |
          $cmake = (Get-Command cmake).Source
          $pkg = "$env:RUNNER_TEMP/pkg"
          Expand-Archive (Get-Item build-app/package/Kutta-*-windows.zip).FullName -DestinationPath $pkg
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          $kutta = "$pkg/Kutta/solver/kutta.exe"
          & $kutta devices
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Reads an HDF5 mesh, so the bundled HDF5 libraries load.
          & $kutta export-geometry validation/fluent_examples/simple_duct/simple-duct.msh.h5 --out "$env:RUNNER_TEMP/pkg-geometry"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Scenarios otherwise pick the build tree's fixture CLI, which is not in the package.
          & $cmake -DAPP="$pkg/Kutta/Kutta.exe" -DCLI="$kutta" -DSCENARIOS=start -DOUT="$env:RUNNER_TEMP/pkg-smoke" -P app/cmake/screenshot_smoke.cmake
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kutta-app-windows
          path: |
            build-app/package/Kutta-*-windows.zip
            build-app/smoke/*.png
          if-no-files-found: error
